version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      agent-framework:
        patterns: ['Microsoft.Agents.AI*']
      aspire:
        patterns: ['Aspire.*', 'CommunityToolkit.Aspire.*']
      opentelemetry:
        patterns: ['OpenTelemetry*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
